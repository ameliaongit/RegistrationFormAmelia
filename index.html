<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #ffdfea;
            margin: 0;
            padding: 20px;
        }
        form {
            background-color: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 8px;
        }
        h2 {
            text-align: center;
            color: #555;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"],
        input[type="email"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #fed9ec;
            border-radius: 8px;
            box-sizing: border-box;
        }
        fieldset {
            border: 1px solid #fed9ec;
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 10px;
        }
        legend {
            font-weight:bold;
            color: #555;
        }
        .radio-group, .checkbox-group {
            margin-bottom: 5px;
        }
        .radio-group label, .checkbox-group label {
            display: inline;
            font-weight: normal;
        }
        button[type="submit"] {
            background-color: #b3002a75;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button[type="submit"]:hover {
            background-color: #ff003753;
        }
    </style>
</head>
<body>

    <form action="form.html" method="get">
        <h2>Registration Form</h2>

        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" required>
        </div>

        <fieldset>
            <legend>Gender</legend>
            <div class="radio-group">
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
            </div>
            <div class="radio-group">
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
            </div>
            <div class="radio-group">
                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
            </div>
        </fieldset>

        <fieldset>
            <legend>Hobbies</legend>
            <div class="checkbox-group">
                <input type="checkbox" id="reading" name="hobbies" value="reading">
                <label for="reading">Reading</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="sports" name="hobbies" value="sports">
                <label for="sports">Sports</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="music" name="hobbies" value="music">
                <label for="music">Music</label>
            </div>
            <div class="form-group">
                <input type="text" id="otherHobby" name="otherHobby" placeholder="Type your other hobbies here...">
        </fieldset>

        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" required>
        </div>

        <div class="form-group">
            <label for="program">Program of Study</label>
            <select id="program" name="program" required>
                <option value="">Select a program...</option>
                <option value="information_systems">Information Systems</option>
                <option value="computer_science">Computer Science</option>
                <option value="Business_management">Business Management</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="address">Full Address</label>
            <textarea id="address" name="address" rows="4" required></textarea>
        </div>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
